<div class="live-voice-card">

  <div class="small-label">
    LIVE SPEAKING
  </div>

  <h3>
    Telefon kabi Ustoz bilan gaplashing
  </h3>

  <p>
    Mikrofonni yoqing va ingliz tilida
    tabiiy suhbat qiling.
  </p>

  <div class="live-controls">

    <button
      class="button button-primary"
      id="liveStart"
    >
      🎙️ Jonli suhbatni boshlash
    </button>

    <button
      class="button button-secondary"
      id="liveStop"
      disabled
    >
      ⏹ To‘xtatish
    </button>

  </div>

  <div
    class="live-status"
    id="liveStatus"
  >
    Boshlash uchun tugmani bosing.
  </div>

  <div
    class="live-transcript"
    id="liveTranscript"
  ></div>

</div>
