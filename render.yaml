services:
  - type: web
    name: ielts-ustoz-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live

      - key: GEMINI_TEXT_MODEL
        value: gemini-3.8-flash
