services:
  - type: web
    name: ielts-ustoz-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: OPENAI_API_KEY
        sync: false

      - key: AI_MODEL
        value: gpt-5.6-luna

      - key: TRANSCRIBE_MODEL
        value: gpt-4o-transcribe

      - key: TTS_MODEL
        value: gpt-4o-mini-tts
